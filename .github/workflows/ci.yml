name: Foundation checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: faultline
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: faultline_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U faultline -d faultline_test" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://faultline:ci-only-password@localhost:5432/faultline_test
      PYTHONPATH: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r services/api/requirements.lock
      - run: ruff check services/api
      - run: ruff format --check services/api
      - run: pytest -q
      - run: python services/api/scripts/export_openapi.py
      - run: git diff --exit-code -- packages/api-client/openapi.json
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - run: npm run api:generate
      - run: git diff --exit-code -- packages/api-client/schema.d.ts
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test:mobile
      - run: npx expo export --platform all
        working-directory: apps/mobile
